<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Next-Gen Secure Chat Platform</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/css/main.css" />
</head>
<body>

<div class="background-blobs">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
</div>

<noscript>
    <div class="no-js">Please enable JavaScript to run this application.</div>
</noscript>

<!-- Username / Login Screen -->
<div id="username-page" class="page active">
    <div class="glass-card login-card">
        <div class="app-icon">
            <i class="fa-solid fa-comments"></i>
        </div>
        <h1>Welcome to Web-Chat </h1>
        <p>Connect instantly with your friends real-time.</p>
        <form id="usernameForm">
            <div class="input-container">
                <i class="fa-solid fa-user"></i>
                <input type="text" id="name" placeholder="Choose a unique handle..." autocomplete="off" required />
            </div>
            <button type="submit" class="btn-primary">
                <span>Enter Studio</span>
                <i class="fa-solid fa-arrow-right"></i>
            </button>
        </form>
    </div>
</div>

<!-- Active Chat Room Screen -->
<div id="chat-page" class="page hidden">
    <div class="glass-card chat-wrapper">
        <!-- Header Section -->
        <div class="chat-header">
            <div class="room-info">
                <div class="avatar-group">
                    <div class="pulse-dot"></div>
                </div>
                <div>
                    <h2>Global Lounge</h2>
                    <span id="connection-status" class="status-badge connecting">Connecting...</span>
                </div>
            </div>
            <div class="header-actions">
                <span id="current-user-display" class="user-badge"><i class="fa-solid fa-circle-user"></i> <span id="display-username"></span></span>
            </div>
        </div>

        <!-- Messages Stream View -->
        <ul id="messageArea" class="message-feed">
            <!-- Dynamic messages populate here -->
        </ul>

        <!-- Message Typing Form (Fixed) -->
        <form id="messageForm" class="chat-input-area">
            <div class="input-container">
                <input type="text" id="message" placeholder="Type your message here..." autocomplete="off" required />
                <button type="submit" class="btn-send" title="Send Message">
                    <i class="fa-solid fa-paper-plane"></i>
                </button>
            </div>
        </form>
    </div>
</div>

<!-- Required Scripts -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.1.4/sockjs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
<script src="/js/main.js"></script>
</body>
</html>
